<!doctype html>
<html lang="en-LK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ORAYEN is a Sri Lankan technology and digital solutions company offering web and mobile development, UI/UX, graphic design, and Canva design.">
  <meta name="theme-color" content="#080f24">
  <title>ORAYEN — Technology &amp; Digital Solutions</title>
  <link rel="icon" href="/assets/favicon.png" type="image/png">
  <style>
    body { margin: 0; background: #080f24; }
    .intro {
      position: fixed;
      z-index: 100;
      inset: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: radial-gradient(ellipse at center, #122752 0%, #080f24 68%);
      animation: intro-exit .2s cubic-bezier(.65, 0, .35, 1) 4.2s forwards;
    }
    .intro-stage {
      --nav-logo-width: 148px;
      --nav-logo-center-x: max(115.6px, calc(50vw - 584.4px));
      --nav-logo-center-y: 51.5px;
      --viewport-center-x: 50vw;
      --viewport-center-y: 50vh;
      width: clamp(240px, 46vw, 500px);
      display: flex;
      align-items: center;
      transform: translateX(36.14%);
      will-change: transform;
      animation:
        stage-shift 1.3s cubic-bezier(.65, 0, .35, 1) 1.7s forwards,
        stage-to-nav 1s cubic-bezier(.65, 0, .35, 1) 3.2s forwards;
    }
    .intro-mark {
      display: block;
      width: 29.24%;
      height: auto;
      flex: 0 0 auto;
      opacity: 0;
      transform: rotate(0deg) scale(.7);
      transform-origin: 47.4% 50%;
      will-change: transform, opacity;
      animation:
        mark-in .8s cubic-bezier(.22, 1, .36, 1) .15s forwards,
        mark-spin 1.9s cubic-bezier(.45, 0, .15, 1) .15s forwards;
    }
    .intro-text {
      display: block;
      width: 70.76%;
      height: auto;
      flex: 0 0 auto;
      opacity: 0;
      filter: blur(10px);
      transform: translateX(-10%);
      -webkit-mask-image: linear-gradient(90deg, #000 40%, transparent 60%);
      mask-image: linear-gradient(90deg, #000 40%, transparent 60%);
      -webkit-mask-size: 260% 100%;
      mask-size: 260% 100%;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      -webkit-mask-position: 100% 0;
      mask-position: 100% 0;
      will-change: transform, opacity, filter, mask-position;
      animation:
        text-in 1.2s cubic-bezier(.22, 1, .36, 1) 1.75s forwards,
        text-reveal 1.4s cubic-bezier(.45, 0, .2, 1) 1.75s forwards;
    }
    @keyframes mark-in { to { opacity: 1; transform: rotate(var(--r, 0deg)) scale(1); } }
    @keyframes mark-spin { to { transform: rotate(-360deg) scale(1); } }
    @keyframes stage-shift { to { transform: translateX(0); } }
    @keyframes stage-to-nav {
      to {
        width: var(--nav-logo-width);
        transform: translate(calc(var(--nav-logo-center-x) - var(--viewport-center-x)), calc(var(--nav-logo-center-y) - var(--viewport-center-y)));
      }
    }
    @keyframes text-in { to { opacity: 1; filter: blur(0); transform: translateX(0); } }
    @keyframes text-reveal { to { -webkit-mask-position: 0 0; mask-position: 0 0; } }
    @keyframes intro-exit {
      from { opacity: 1; visibility: visible; }
      to { opacity: 0; visibility: hidden; }
    }
    @media (prefers-reduced-motion: reduce) {
      .intro { animation-duration: .6s; animation-delay: 1.2s; }
      .intro-stage { transform: none; animation: none; }
      .intro-mark { transform: none; animation: mark-fade .4s ease forwards; }
      .intro-text {
        filter: none;
        transform: none;
        -webkit-mask-image: none;
        mask-image: none;
        animation: mark-fade .4s ease .2s forwards;
      }
      @keyframes mark-fade { to { opacity: 1; } }
    }
    @media (max-width: 900px) {
      .intro-stage { --nav-logo-width: 124px; --nav-logo-center-x: 98px; }
    }
    @media (max-width: 720px) {
      .intro-stage { --nav-logo-center-x: 90px; --nav-logo-center-y: 42.5px; }
    }
  </style>
</head>
<body>
  <noscript>Enable JavaScript to view the ORAYEN website.</noscript>
  <div class="intro" role="status" aria-label="Loading ORAYEN">
    <div class="intro-stage" aria-hidden="true">
      <img class="intro-mark" src="/assets/orayen-symbol.png" alt="">
      <img class="intro-text" src="/assets/orayen-text.png" alt="">
    </div>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
