<!doctype html>
<html lang="en-LK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ORAYEN is a Sri Lankan technology and digital solutions company offering web and mobile development, UI/UX, graphic design, and Canva design.">
  <meta name="theme-color" content="#080f24">
  <title>ORAYEN — Technology &amp; Digital Solutions</title>
  <link rel="icon" href="./assets/favicon.png" type="image/png">
  <style>
    body { margin: 0; background: #080f24; }
    .intro {
      position: fixed;
      z-index: 100;
      inset: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: radial-gradient(ellipse at center, #122752 0%, #080f24 68%);
      animation: intro-exit 3s cubic-bezier(.65, 0, .35, 1) 0s forwards;
    }
    .intro-logo {
      display: flex;
      align-items: center;
      gap: .12em;
      color: #fff;
      font: 800 clamp(3rem, 11vw, 6rem)/1 Arial, sans-serif;
      letter-spacing: -.075em;
    }
    .intro-mark {
      width: 1em;
      height: 1em;
      flex: 0 0 auto;
      animation: intro-spin 1.15s cubic-bezier(.37, 0, .63, 1) both;
    }
    .intro-letter {
      display: inline-block;
      opacity: 0;
      transform: translateX(-.65em) scale(.92);
      animation: intro-letter-in .55s cubic-bezier(.16, 1, .3, 1) forwards;
    }
    .intro-letter:nth-child(2) { animation-delay: 1.18s; }
    .intro-letter:nth-child(3) { animation-delay: 1.26s; }
    .intro-letter:nth-child(4) { animation-delay: 1.34s; }
    .intro-letter:nth-child(5) { animation-delay: 1.42s; }
    .intro-letter:nth-child(6) { animation-delay: 1.5s; }
    @keyframes intro-spin { to { transform: rotate(-360deg); } }
    @keyframes intro-letter-in {
      to { opacity: 1; transform: translateX(0) scale(1); }
    }
    @keyframes intro-exit {
      0%, 78% { opacity: 1; visibility: visible; }
      100% { opacity: 0; visibility: hidden; }
    }
    @media (prefers-reduced-motion: reduce) {
      .intro { animation-duration: .8s; }
      .intro-mark { animation: none; }
      .intro-letter { animation-duration: .01ms; animation-delay: 0s; }
    }
  </style>
  <script type="module" crossorigin src="./assets/index-BVhveFYC.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-3uBpYl1X.css">
</head>
<body>
  <noscript>Enable JavaScript to view the ORAYEN website.</noscript>
  <div class="intro" role="status" aria-label="Loading ORAYEN">
    <div class="intro-logo" aria-hidden="true">
      <img class="intro-mark" src="./assets/favicon.png" alt="">
      <span class="intro-letter">r</span>
      <span class="intro-letter">a</span>
      <span class="intro-letter">y</span>
      <span class="intro-letter">e</span>
      <span class="intro-letter">n</span>
    </div>
  </div>
  <div id="root"></div>
</body>
</html>
